<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Business</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 50px 20px;
    }

    .logo {
      font-size: 55px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      font-size: 16px;
      margin-bottom: 35px;
    }

    .card {
      background: #171717;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin-bottom: 10px;
    }

    .card p {
      color: #bbb;
      line-height: 1.6;
    }

    .button {
      display: block;
      text-decoration: none;
      background: #1877f2;
      color: white;
      padding: 15px;
      border-radius: 10px;
      margin: 12px 0;
      font-weight: bold;
    }

    .gmail {
      background: #ea4335;
    }

    .contact {
      background: #333;
    }

    footer {
      margin-top: 35px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🏢</div>

    <h1>My Business</h1>

    <p class="subtitle">
      Welcome to our official website
    </p>

    <div class="card">
      <h2>About Us</h2>
      <p>
        Welcome to our business. We provide quality service
        and support to our customers.
      </p>
    </div>

    <div class="card">
      <h2>Contact Us</h2>

      <a class="button" href="#">
        Facebook
      </a>

      <a class="button gmail" href="#">
        Gmail
      </a>

      <a class="button contact" href="#">
        Contact
      </a>
    </div>

    <footer>
      © 2026 My Business. All rights reserved.
    </footer>

  </div>

</body>
</html>
